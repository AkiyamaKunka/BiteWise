# Mobile build smoke test: proves that the iOS project (Runner AND the
# ShareExtension target) and the Android project still compile on a clean
# machine. No signing, no secrets, no store upload, so it is safe on fork PRs
# and the owner can watch it pass today, before the Apple Developer Program
# enrolment. The signed release lane is release.yml; the owner's checklist is
# docs/RELEASING.md. python-tests.yml (pytest, analyze, test, parity) is
# deliberately untouched.
#
# Docs-only changes (docs/, any *.md, the Play what's-new text) skip it. A
# push to a branch that has an open PR still runs twice (push + pull_request
# are separate concurrency groups); drop the loop/feat/fix branches below if
# the 5-concurrent-macOS-job allowance ever gets in the way.
name: Mobile build

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'app/android/whatsnew/**'
  push:
    branches:
      - main
      - 'loop/**'
      - 'feat/**'
      - 'fix/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'app/android/whatsnew/**'

permissions:
  contents: read

# One run per branch / PR; a newer push cancels the older build.
concurrency:
  group: mobile-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the owner's local SDK (`flutter --version`, 2026-10-10). Bump it
  # here and in release.yml together.
  FLUTTER_VERSION: "3.44.2"
  # The owner's Mac runs Xcode 26.2. GitHub drops old patch versions from the
  # macos-26 image over time; when this one is gone the job warns and uses the
  # image default instead of failing. Set it to "" to always use the default.
  XCODE_VERSION: "26.2"

defaults:
  run:
    shell: bash

jobs:
  ios-build:
    name: iOS (unsigned, both targets)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -n "$XCODE_VERSION" ] && [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          elif [ -n "$XCODE_VERSION" ]; then
            echo "::warning::Xcode ${XCODE_VERSION} is not on this runner image any more; using $(xcode-select -p). Update XCODE_VERSION in .github/workflows/*.yml."
          fi
          xcodebuild -version

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      # --no-codesign archives with CODE_SIGNING_ALLOWED=NO, so no certificate,
      # profile or Apple account is needed. Both targets are compiled and
      # linked; only the signature is missing.
      - name: Build iOS (release, no codesign)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Both targets are in the bundle
        working-directory: app
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          test -x "$app/Runner"
          test -d "$app/PlugIns/ShareExtension.appex"
          for bundle in "$app" "$app/PlugIns/ShareExtension.appex"; do
            printf '%s: ' "$(basename "$bundle")"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$bundle/Info.plist" | paste -sd ' ' -
            # Each executable uses a required-reason API (UserDefaults via
            # receive_sharing_intent, which ships no manifest of its own), so
            # App Store Connect emails ITMS-91053 for any bundle missing this.
            test -f "$bundle/PrivacyInfo.xcprivacy" || { echo "::error::$(basename "$bundle") has no PrivacyInfo.xcprivacy (ITMS-91053 Missing API declaration would follow)"; exit 1; }
            plutil -lint "$bundle/PrivacyInfo.xcprivacy"
          done

  android-build:
    name: Android (app bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      # There is no android/key.properties on CI, so app/build.gradle.kts
      # signs the release bundle with the DEBUG key and prints a warning. That
      # is the point of this job: compile + R8 + bundling, nothing uploadable.
      - name: Build app bundle (release, debug-signed)
        working-directory: app
        run: flutter build appbundle --release

      # MainActivity's decisions (IntakeRules.kt) on the JVM: the share
      # replay rule, the share-out filter, the cache-only save check, the
      # one-answer call state, the pick limits and the settings link
      # (app/android/app/src/test). After the build, which writes
      # android/local.properties.
      - name: Android unit tests (MainActivity's rules)
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest

      # The same release build as an APK (it reuses the bundle's compiled
      # and shrunk code), so aapt2 can read the merged manifest: the
      # libraries' permissions included, which is what Play reviews.
      - name: Build APK (release, debug-signed)
        working-directory: app
        run: flutter build apk --release

      # Exactly these, no more and no fewer. A new permission is a Play
      # review question and a Data safety answer: add it here on purpose
      # (manifest_gate_test checks every permission the main manifest
      # declares is on this list). Never FOREGROUND_SERVICE (stripped from
      # WorkManager) or an exact-alarm permission.
      - name: The APK asks for exactly the allowed permissions
        working-directory: app
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt2="$(ls -d "$sdk"/build-tools/* | sort -V | tail -1)/aapt2"
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$aapt2" dump permissions "$apk"
          got=$("$aapt2" dump permissions "$apk" \
            | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" | LC_ALL=C sort -u)
          allowed=$(sed 's/^[[:space:]]*//' <<'LIST' | LC_ALL=C sort -u
            android.permission.INTERNET
            android.permission.READ_MEDIA_IMAGES
            android.permission.READ_MEDIA_VISUAL_USER_SELECTED
            android.permission.READ_EXTERNAL_STORAGE
            android.permission.POST_NOTIFICATIONS
            android.permission.RECEIVE_BOOT_COMPLETED
            android.permission.VIBRATE
            android.permission.WAKE_LOCK
            android.permission.ACCESS_NETWORK_STATE
            dev.calorietracker.calorie_tracker.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
          LIST
          )
          for banned in FOREGROUND_SERVICE SCHEDULE_EXACT_ALARM USE_EXACT_ALARM; do
            if grep -qx "android.permission.$banned" <<<"$got"; then
              echo "::error::app-release.apk asks for android.permission.$banned"
              exit 1
            fi
          done
          unexpected=$(LC_ALL=C comm -23 <(echo "$got") <(echo "$allowed"))
          missing=$(LC_ALL=C comm -13 <(echo "$got") <(echo "$allowed"))
          if [ -n "$unexpected" ]; then
            echo "::error::app-release.apk asks for permissions not on the allowlist: $(echo $unexpected)"
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::error::app-release.apk no longer asks for: $(echo $missing). Update the allowlist in .github/workflows/mobile-build.yml with the manifest."
            exit 1
          fi
          echo "Permissions match the allowlist."

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-aab-debug-signed
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error
