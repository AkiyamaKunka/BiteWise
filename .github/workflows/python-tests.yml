name: Tests

on: [push, pull_request]

jobs:
  test:
    # A fixed image, not ubuntu-latest: that label moved to Ubuntu 26.04,
    # for which setup-python has no Python 3.9 build, and the 3.9 leg
    # failed in its setup step before any test ran (2026-11-06).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10"]

    steps:
    - uses: actions/checkout@v4

    - name: Public safety check
      if: matrix.python-version == '3.10'
      run: |
        bash scripts/check_public_safety.sh

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # scripts/bench_image_pipeline.py needs numpy (dev tool, kept out
        # of requirements.txt so the 1 GB VM never installs it)
        pip install numpy

    - name: Lint with ruff
      if: matrix.python-version == '3.10'
      run: |
        pip install ruff==0.15.20
        ruff check --select F,E9 .

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=78

  flutter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Pinned like mobile-build.yml and release.yml (keep the three equal):
    # an unpinned "stable" picked up a release that deprecates
    # package:flutter/material.dart, and analyze failed on every PR.
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: "3.44.2"
        channel: stable
        cache: true

    - name: Pub get
      working-directory: app
      run: flutter pub get

    - name: Analyze
      working-directory: app
      run: flutter analyze

    - name: Test
      working-directory: app
      run: flutter test

    - name: Parity bindings in sync
      run: python3 scripts/sync_shared.py --check
